appId: com.rachit.docvault
productName: DocVault
directories:
  buildResources: build
  output: dist-app
# No asar: the MCP sidecar reads plain vault files and dlopens better-sqlite3.
asar: false
# Rebuild native modules against Electron's ABI. The sidecar runs on Electron's
# own bundled Node (ELECTRON_RUN_AS_NODE, see src/main/ipc.ts), so better-sqlite3
# must match Electron's ABI — NOT the user's (drifting) system-node ABI.
npmRebuild: true
nodeGypRebuild: false
files:
  - out/**/*
  - package.json
  - '!**/*.map'
# Harden the packaged Electron binary (disable RunAsNode / inspector / NODE_OPTIONS,
# encrypt cookies). Runs before signing so the modified binary is what gets signed.
afterPack: build/fuses.cjs
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Unsigned for local `dir` builds. For a distributable, signed dmg + working
  # auto-update: set identity to your Developer ID (or export CSC_LINK/CSC_KEY_PASSWORD),
  # flip `notarize` on, and export APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # (never commit these). hardenedRuntime + the entitlements below are required for
  # notarization and are only applied when a signing identity is present.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Set to { teamId: "$APPLE_TEAM_ID" } (or true) in the signed-release flow to
  # notarize via notarytool; kept false so local unsigned `dir` builds don't try.
  notarize: false
  target:
    - target: dir
      arch: arm64
dmg:
  # Standard drag-to-Applications layout for the distributable.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
# Versioned GitHub releases. `pnpm --filter @docvault/desktop release` builds a
# dmg and publishes it here, emitting latest-mac.yml so electron-updater clients
# (see src/main/updater.ts) can find new versions. Functional macOS auto-update
# additionally requires a signed + notarized build.
publish:
  provider: github
  owner: rachitt
  repo: docvault
