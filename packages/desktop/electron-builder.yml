appId: com.rachit.docvault
productName: DocVault
directories:
  buildResources: build
  output: dist-app
# No asar: the app spawns a system-node MCP sidecar that must read plain files
# and dlopen better-sqlite3.
asar: false
# Do NOT rebuild native modules for Electron — better-sqlite3 runs under the
# system-node sidecar and must keep its node ABI.
npmRebuild: false
nodeGypRebuild: false
files:
  - out/**/*
  - package.json
  - '!**/*.map'
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Unsigned for local `dir` builds. For a distributable, signed dmg + working
  # auto-update, set identity to your Developer ID and notarize (see README).
  identity: null
  target:
    - target: dir
      arch: arm64
dmg:
  # Standard drag-to-Applications layout for the distributable.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
# Versioned GitHub releases. `pnpm --filter @docvault/desktop release` builds a
# dmg and publishes it here, emitting latest-mac.yml so electron-updater clients
# (see src/main/updater.ts) can find new versions. Functional macOS auto-update
# additionally requires a signed + notarized build.
publish:
  provider: github
  owner: rachitt
  repo: docvault
